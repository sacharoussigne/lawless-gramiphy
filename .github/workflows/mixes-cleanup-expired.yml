# Nettoie les mixes temporaires expirés (POST /api/mixes/cleanup-expired).
#
# Auth: secret partagé (Bearer token).
# Secrets GitHub à définir :
#   - APP_URL
#   - MIX_CLEANUP_CRON_SECRET

name: Mixes — cleanup expirés

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Nettoyage des mixes expirés
        env:
          APP_URL: ${{ secrets.APP_URL }}
          MIX_CLEANUP_CRON_SECRET: ${{ secrets.MIX_CLEANUP_CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${APP_URL:-}" ]; then
            echo "Secret APP_URL manquant."
            exit 1
          fi
          if [ -z "${MIX_CLEANUP_CRON_SECRET:-}" ]; then
            echo "Secret MIX_CLEANUP_CRON_SECRET manquant."
            exit 1
          fi

          BASE="${APP_URL%/}"
          CLEANUP_URL="${BASE}/api/mixes/cleanup-expired"

          echo "→ POST cleanup (Authorization: Bearer …)"
          curl -sS -f -X POST "$CLEANUP_URL" \
            -H "Authorization: Bearer ${MIX_CLEANUP_CRON_SECRET}" \
            -o /tmp/cleanup_body.json

          echo "Réponse :"
          cat /tmp/cleanup_body.json
          echo
