# Nettoie les mixes temporaires expirés (POST /api/mixes/cleanup-expired).
#
# Deux modes (définis MIX_CLEANUP_CRON_SECRET sur le serveur + dans GitHub) :
#   A — Secret partagé (recommandé) : secrets APP_URL + MIX_CLEANUP_CRON_SECRET
#   B — Session admin Better Auth : APP_URL + CRON_ADMIN_EMAIL + CRON_ADMIN_PASSWORD
#
# Si MIX_CLEANUP_CRON_SECRET est défini dans le workflow, le mode A est utilisé (pas de login email).

name: Mixes — cleanup expirés

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Nettoyage des mixes expirés
        env:
          APP_URL: ${{ secrets.APP_URL }}
          MIX_CLEANUP_CRON_SECRET: ${{ secrets.MIX_CLEANUP_CRON_SECRET }}
          ADMIN_EMAIL: ${{ secrets.CRON_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.CRON_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${APP_URL:-}" ]; then
            echo "Secret APP_URL manquant."
            exit 1
          fi

          BASE="${APP_URL%/}"
          CLEANUP_URL="${BASE}/api/mixes/cleanup-expired"

          if [ -n "${MIX_CLEANUP_CRON_SECRET:-}" ]; then
            echo "→ POST cleanup (Authorization: Bearer …)"
            curl -sS -f -X POST "$CLEANUP_URL" \
              -H "Authorization: Bearer ${MIX_CLEANUP_CRON_SECRET}" \
              -o /tmp/cleanup_body.json
          else
            if [ -z "${ADMIN_EMAIL:-}" ] || [ -z "${ADMIN_PASSWORD:-}" ]; then
              echo "Définis MIX_CLEANUP_CRON_SECRET, ou bien CRON_ADMIN_EMAIL et CRON_ADMIN_PASSWORD."
              exit 1
            fi
            COOKIE_JAR="$(mktemp)"
            trap 'rm -f "$COOKIE_JAR"' EXIT
            PAYLOAD="$(jq -n --arg email "$ADMIN_EMAIL" --arg password "$ADMIN_PASSWORD" \
              '{email:$email,password:$password}')"
            SIGN_IN_URL="${BASE}/api/auth/sign-in/email"

            echo "→ Connexion Better Auth…"
            HTTP_CODE="$(curl -sS -c "$COOKIE_JAR" -X POST "$SIGN_IN_URL" \
              -H "Content-Type: application/json" \
              -H "Origin: ${BASE}" \
              -H "Referer: ${BASE}/" \
              -d "$PAYLOAD" \
              -o /tmp/signin_body.json \
              -w "%{http_code}")"

            if [ "$HTTP_CODE" != "200" ]; then
              echo "Échec connexion : HTTP $HTTP_CODE"
              cat /tmp/signin_body.json || true
              exit 1
            fi

            echo "→ POST cleanup (session cookie)…"
            curl -sS -f -b "$COOKIE_JAR" -X POST "$CLEANUP_URL" \
              -H "Origin: ${BASE}" \
              -H "Referer: ${BASE}/" \
              -o /tmp/cleanup_body.json
          fi

          echo "Réponse :"
          cat /tmp/cleanup_body.json
          echo
